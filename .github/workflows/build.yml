
name: Build Nintendo 3DS homebrew

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install 3DS libraries
        run: dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Compile
        run: make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer3DS-homebrew
          path: |
            **/*.3dsx
            **/*.elf
            **/*.smdh
          if-no-files-found: error
