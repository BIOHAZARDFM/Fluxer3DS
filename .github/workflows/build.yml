
name: Build Nintendo 3DS homebrew

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Update package database
        run: dkp-pacman -Syu --noconfirm

      - name: Install 3DS libraries
        run: |
          dkp-pacman -S --noconfirm libctru citro3d citro2d
          test -f "$DEVKITPRO/libctru/include/3ds.h"

      - name: Compile
        run: make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer3DS-homebrew
          path: |
            Fluxer3DS.3dsx
            Fluxer3DS.elf
            Fluxer3DS.smdh
          if-no-files-found: error
