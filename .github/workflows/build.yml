name: Build Nintendo 3DS homebrew

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
    
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev

      - name: Diagnose 3DS headers
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          echo "Checking libctru..."
          ls -la "$DEVKITPRO/libctru/include/" || true
          find "$DEVKITPRO" -name 3ds.h -print
          test -f "$DEVKITPRO/libctru/include/3ds.h"

      - name: Compile
        run: make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer3DS-homebrew
          path: |
            Fluxer3DS.3dsx
            Fluxer3DS.elf
            Fluxer3DS.smdh
          if-no-files-found: error
      - name: Show compiler configuration
        run: |
          echo "Checking header:"
          ls -l "$DEVKITPRO/libctru/include/3ds.h"
          echo "Compiler:"
          which arm-none-eabi-gcc
          echo "Compiler flags:"
          make -n | head -40
