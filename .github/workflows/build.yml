name: Build Nintendo 3DS homebrew

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS libraries
        run: |
          # The official devkitarm image already includes the 3DS toolchain
          # and 3ds-dev dependencies. Keep its bundled package database:
          # forcing -Sy here hits the devkitPro mirror's current HTTP 403.
          dkp-pacman -S --needed --noconfirm 3ds-mbedtls 3ds-curl 3dstools
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

      - name: Find ARM toolchain
        run: |
          export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          command -v arm-none-eabi-gcc
          command -v 3dsxtool

      - name: Inspect bundled title audio
        run: |
          python3 - <<'PY'
          import wave
          path = "TITLE.WAV"
          with wave.open(path, "rb") as wav:
              print("TITLE.WAV format: PCM")
              print(f"Channels: {wav.getnchannels()}")
              print(f"Sample rate: {wav.getframerate()} Hz")
              print(f"Sample width: {wav.getsampwidth() * 8} bit")
              print(f"Frames: {wav.getnframes()}")
              print(f"Duration: {wav.getnframes() / wav.getframerate():.2f} seconds")
          PY

      - name: Compile 3DSX
        run: |
          export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          make

      - name: Upload 3DSX build
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer3DS-builds
          path: |
            Fluxer3DS.3dsx
            Fluxer3DS.elf
            Fluxer3DS.smdh
          if-no-files-found: error
