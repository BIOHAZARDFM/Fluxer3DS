
name: Build Nintendo 3DS homebrew

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev 3ds-mbedtls

      - name: Find ARM toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          echo "PATH=$PATH"
          echo "Searching for ARM compiler..."
          find "$DEVKITPRO" -type f -name 'arm-none-eabi-gcc' -print
          find /usr -type f -name 'arm-none-eabi-gcc' -print 2>/dev/null || true
          echo "Checking compiler commands..."
          command -v arm-none-eabi-gcc || true
          command -v arm-none-eabi-gcc.exe || true
          ls -la "$DEVKITPRO/devkitARM/bin/" || true

      - name: Compile
        run: |
          export PATH="$DEVKITPRO/devkitARM/bin:$PATH"
          make clean
          make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer3DS-homebrew
          path: |
            Fluxer3DS.3dsx
            Fluxer3DS.elf
          if-no-files-found: error
