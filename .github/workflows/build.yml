
name: Build Nintendo 3DS homebrew

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:20260610

    env:
      CC: arm-none-eabi-gcc
      CXX: arm-none-eabi-g++
      LD: arm-none-eabi-gcc

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev

      - name: Check toolchain
        run: |
          echo "Checking 3DS header..."
          test -f "$DEVKITPRO/libctru/include/3ds.h"
          echo "3DS header found!"

          echo "Checking ARM compiler..."
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version

          echo "Checking ARM linker..."
          command -v arm-none-eabi-ld

      - name: Compile
        run: |
          make clean
          make CC=arm-none-eabi-gcc CXX=arm-none-eabi-g++ LD=arm-none-eabi-gcc

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer3DS-homebrew
          path: |
            Fluxer3DS.3dsx
            Fluxer3DS.elf
          if-no-files-found: error
