name: Build Nintendo 3DS homebrew

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS libraries
        run: |
          dkp-pacman -S --noconfirm 3ds-dev

      - name: Verify 3DS libraries
        run: |
          test -f "$DEVKITPRO/libctru/include/3ds.h"
          echo "3DS headers found!"

      - name: Compile
        run: make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer3DS-homebrew
          path: |
            Fluxer3DS.3dsx
            Fluxer3DS.elf
            Fluxer3DS.smdh
          if-no-files-found: error
